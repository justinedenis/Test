<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coding & Graphic Design Portfolio</title>
  <style>
    :root {
      --bg-dark: #0a131a;
      --accent-orange: #ff6b35;
      --accent-teal: #00a896;
      --text-light: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      overflow-x: hidden;
      min-height: 200vh; /* Added height for scroll demonstration */
    }

    /* --- HERO CONTAINER --- */
    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* --- CONCEPT 1: WebGL/Canvas Style Glowing Mesh Background --- */
    .bg-mesh {
      position: absolute;
      top: -20%;
      left: -20%;
      width: 140%;
      height: 140%;
      background: 
        radial-gradient(circle at 30% 40%, rgba(0, 168, 150, 0.45) 0%, transparent 50%),
        radial-gradient(circle at 70% 60%, rgba(255, 107, 53, 0.45) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(13, 27, 42, 0.9) 0%, #0a131a 100%);
      filter: blur(60px);
      animation: meshPulse 8s ease-in-out infinite alternate;
      z-index: 1;
    }

    @keyframes meshPulse {
      0% { transform: scale(1) rotate(0deg); }
      100% { transform: scale(1.08) rotate(5deg); }
    }

    /* --- LAYER: Grid Overlay --- */
    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 2;
      opacity: 0.5;
    }

    /* --- LAYER: Interactive Floating Vector Objects --- */
    .interactive-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .floating-vector {
      position: absolute;
      transition: transform 0.1s ease-out;
      will-change: transform;
    }

    /* Feather 1 */
    .feather-1 {
      top: 15%;
      left: 35%;
      width: 80px;
      animation: floatSmooth 4s ease-in-out infinite alternate;
    }

    /* Feather 2 */
    .feather-2 {
      bottom: 12%;
      right: 20%;
      width: 110px;
      animation: floatSmooth 6s ease-in-out infinite alternate-reverse;
    }

    /* Gear Vector */
    .gear {
      top: 50%;
      left: 12%;
      width: 70px;
      animation: spinGear 20s linear infinite;
    }

    @keyframes floatSmooth {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-20px) rotate(8deg); }
    }

    @keyframes spinGear {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* --- LAYER: Typography & Content --- */
    .hero-content {
      position: relative;
      z-index: 4;
      text-align: center;
      pointer-events: auto;
    }

    .title {
      font-size: clamp(3rem, 7vw, 6rem);
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1.1;
      margin-bottom: 15px;
      text-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .title .divider {
      color: var(--accent-orange);
      font-weight: 300;
      margin: 0 10px;
    }

    .subtitle {
      font-size: 1.4rem;
      font-weight: 300;
      opacity: 0.85;
      letter-spacing: 0.5px;
    }

    /* --- CONCEPT 2: Micro-interactions (Navigation Buttons) --- */
    .nav-arrow {
      position: absolute;
      z-index: 5;
      width: 48px;
      height: 48px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .nav-arrow:hover {
      background: var(--accent-orange);
      transform: scale(1.15);
      box-shadow: 0 0 20px rgba(255, 107, 53, 0.6);
    }

    .nav-arrow svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: #fff;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrow-top    { top: 30px; left: 50%; transform: translateX(-50%); }
    .arrow-bottom { bottom: 30px; left: 50%; transform: translateX(-50%); }
    .arrow-left   { left: 30px; top: 50%; transform: translateY(-50%); }
    .arrow-right  { right: 30px; top: 50%; transform: translateY(-50%); }

    /* Fix hover transforms for edge cases */
    .arrow-top:hover    { transform: translateX(-50%) scale(1.15); }
    .arrow-bottom:hover { transform: translateX(-50%) scale(1.15); }
    .arrow-left:hover   { transform: translateY(-50%) scale(1.15); }
    .arrow-right:hover  { transform: translateY(-50%) scale(1.15); }

    /* Dummy section below to showcase scroll */
    .demo-section {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #060b0e;
      font-size: 2rem;
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <section class="hero" id="hero">
    <!-- Concept: Animated Gradient Blur Mesh -->
    <div class="bg-mesh"></div>
    
    <!-- Concept: SVG Grid Background Layer -->
    <div class="grid-overlay"></div>

    <!-- Concept: Interactive Vectors (Mouse Tracking + Parallax) -->
    <div class="interactive-layer">
      <!-- Vector Feather 1 -->
      <svg class="floating-vector feather-1" data-speed="-3" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1">
        <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L3 12.5V19h6.5z"></path>
        <line x1="16" y1="8" x2="2" y2="22"></line>
      </svg>

      <!-- Vector Feather 2 -->
      <svg class="floating-vector feather-2" data-speed="4" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1">
        <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L3 12.5V19h6.5z"></path>
        <line x1="16" y1="8" x2="2" y2="22"></line>
      </svg>

      <!-- Vector Gear (Spinning Micro-interaction) -->
      <svg class="floating-vector gear" data-speed="2" viewBox="0 0 24 24" fill="none" stroke="rgba(255,107,83,0.5)" stroke-width="1.5">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </div>

    <!-- Center Typography -->
    <div class="hero-content">
      <h1 class="title">Coding<span class="divider">|</span>Graphic Design</h1>
      <p class="subtitle">Portfolio of a realistic dreamer</p>
    </div>

    <!-- Concept: Micro-interaction Controls -->
    <button class="nav-arrow arrow-top" aria-label="Up">
      <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"></polyline></svg>
    </button>
    <button class="nav-arrow arrow-bottom" onclick="window.scrollTo({top: window.innerHeight, behavior: 'smooth'})" aria-label="Down">
      <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </button>
    <button class="nav-arrow arrow-left" aria-label="Left">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <button class="nav-arrow arrow-right" aria-label="Right">
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
  </section>

  <section class="demo-section">
    <p>Scroll back up to test the Parallax & Interactive effects</p>
  </section>

  <script>
    // --- CONCEPT 3: Mouse Parallax Effect ---
    // Moves vector elements dynamically as the user moves their cursor
    const hero = document.getElementById('hero');
    const vectors = document.querySelectorAll('.floating-vector');

    hero.addEventListener('mousemove', (e) => {
      const { clientX, clientY } = e;
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;

      const deltaX = (clientX - centerX) / 30;
      const deltaY = (clientY - centerY) / 30;

      vectors.forEach(vector => {
        const speed = parseFloat(vector.getAttribute('data-speed')) || 1;
        vector.style.transform = `translate(${deltaX * speed}px, ${deltaY * speed}px)`;
      });
    });

    // Reset positions when mouse leaves section
    hero.addEventListener('mouseleave', () => {
      vectors.forEach(vector => {
        vector.style.transform = `translate(0px, 0px)`;
      });
    });

    // --- CONCEPT 4: Scroll-Driven Parallax Effect ---
    // Adjusts background mesh blur and vector positions based on scroll depth
    window.addEventListener('scroll', () => {
      const scrolled = window.scrollY;
      const mesh = document.querySelector('.bg-mesh');
      
      if (scrolled < window.innerHeight) {
        mesh.style.transform = `scale(${1 + scrolled * 0.0005}) translateY(${scrolled * 0.3}px)`;
      }
    });
  </script>
</body>
</html>
